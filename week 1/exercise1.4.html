<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Exercise 1.4</title>
</head>

<body>

    <h1>My Favourite Foods</h1>

    <div>
        <h2>Unordered List</h2>
        <ul>
            <li>Bread</li>
            <li>Butter</li>
            <li>Cheese</li>
        </ul>
    </div>

    <div>
        <h2>Ordered List</h2>
        <ol>
            <li>Tea</li>
            <li>Coffee</li>
            <li>Juice</li>
        </ol>
    </div>

    <div>
        <h2>Description List</h2>
        <dl>
            <dt>Bread</dt>
            <dd>Wheat</dd>
            <dd>Rye</dd>

            <dt>Butter</dt>
            <dd>Salted</dd>
            <dd>Unsalted</dd>
        </dl>
    </div>

</body>
</html>
